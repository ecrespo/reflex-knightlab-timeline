name: Publish to PyPI

# Runs when a version tag (vX.Y.Z) is pushed, i.e. after the release PR is
# merged into main and the merge commit is tagged.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tag matches pyproject version and is on main
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main"
            exit 1
          fi

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish:
    name: Upload to PyPI
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/reflex-knightlab-timeline/
    permissions:
      id-token: write  # PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Empty when the secret is unset -> falls back to Trusted Publishing.
          password: ${{ secrets.PYPI_API_TOKEN }}

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
